name: Game checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Verify committed migration snapshot
        run: git diff --exit-code -- drizzle
      - run: pnpm content:check
      - run: pnpm styles:check
      - run: pnpm lint:guard
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm mobile:build
      - name: Check mobile sheet contrast, chapter transitions and first touch
        run: |
          node scripts/visual/berrak.mjs --surfaces
          node scripts/visual/berrak.mjs --polish
          node scripts/visual/first-session.mjs
          node scripts/visual/layout-audit.mjs 320x568 3,5,10,21 --first-visit --fixed-frame
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/dialog-contrast
      - run: pnpm exec cap copy ios
      - run: pnpm mobile:check
      - run: pnpm build
      - name: Check the Worker and swipe through a scored Arena word
        run: node scripts/verify-worker.mjs --arena-swipe
      - uses: actions/upload-artifact@v4
        with:
          name: studio-checked-build-inputs
          retention-days: 1
          path: |
            pnpm-lock.yaml
            drizzle/

  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        width: [320, 393]
    env:
      EVIDENCE_DIR: outputs/integrity
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm mobile:build
      - name: First journey, control positions and normal-close persistence
        run: node scripts/visual/integrity/run-gate.mjs ${{ matrix.width }}
      - name: Every menu and agreed terminology
        run: |
          node scripts/visual/readability.mjs ${{ matrix.width }}
          node scripts/visual/integrity/terim-denetimi.mjs "$EVIDENCE_DIR" ${{ matrix.width }} --yolculuk "$EVIDENCE_DIR/${{ matrix.width }}/journey/log.json" --kaynak .
      - name: All chapter titles and saved unlock states
        if: matrix.width == 393
        run: node scripts/visual/integrity/chapter-layout.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrity-${{ matrix.width }}
          path: ${{ env.EVIDENCE_DIR }}
          retention-days: 7

  windows:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        view: [320, 393-uygulama, 430-safari]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm mobile:build
      - name: All 53 screens, touch and keyboard
        env:
          VIEWS: ${{ matrix.view }}
          URL: http://127.0.0.1:5385/
          OUT: outputs/windows
        run: |
          node --experimental-transform-types scripts/visual/menu-fixture-server.mjs dist-mobile 5385 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 "$URL" --output /dev/null
          pnpm menu:windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-${{ matrix.view }}
          path: outputs/windows
          retention-days: 7
