name: Game checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Verify committed migration snapshot
        run: git diff --exit-code -- drizzle
      - run: pnpm content:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/verify-worker.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: studio-checked-build-inputs
          retention-days: 1
          path: |
            pnpm-lock.yaml
            drizzle/
